name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and run regressions
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Verify self-contained publish
        shell: pwsh
        run: ./scripts/Publish.ps1
