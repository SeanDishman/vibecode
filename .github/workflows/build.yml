name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build
        run: dotnet build VibeCode.sln -c Release
      - name: Test
        shell: pwsh
        run: ./scripts/Test.ps1 -NoBuild
      - name: Publish
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VibeCode-windows-x64
          path: artifacts/windows-x64/
