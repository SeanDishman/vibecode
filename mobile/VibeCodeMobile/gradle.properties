org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Select a compatible JDK through JAVA_HOME or your local Gradle user settings.

# AGP 9's new DSL is incompatible with the standalone kotlin-android plugin, so Kotlin comes from AGP's own
# built-in support. The Compose compiler plugin is still applied separately - AGP does not bundle that one.
android.builtInKotlin=true
