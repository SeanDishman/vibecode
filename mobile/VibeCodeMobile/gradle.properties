org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Off deliberately: the shared build cache on this machine has served corrupt entries
# ("invalid stored block lengths") for this project's script compilation.
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Use a supported JDK (17 or 21) through JAVA_HOME or the IDE's Gradle JDK setting.
# Do not pin org.gradle.java.home here: that path is machine-specific and breaks source handoffs.

# AGP 9's new DSL is incompatible with the standalone kotlin-android plugin, so Kotlin comes from AGP's own
# built-in support. The Compose compiler plugin is still applied separately - AGP does not bundle that one.
android.builtInKotlin=true
